name: Build V19 Stable APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify uploaded project package
        shell: bash
        run: |
          set -e
          test -f ThermalSuit_V19_STABLE_PROJECT.zip
          unzip -l ThermalSuit_V19_STABLE_PROJECT.zip | head -80

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf android_project
          mkdir -p android_project
          unzip -q -o ThermalSuit_V19_STABLE_PROJECT.zip -d android_project
          test -f android_project/settings.gradle.kts
          test -f android_project/build.gradle.kts
          test -f android_project/app/build.gradle.kts
          test -f android_project/app/src/main/AndroidManifest.xml
          echo "Android project structure OK"

      - name: Build Debug APK
        working-directory: android_project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThermalSuit-V19-Stable-Touch-Boot-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
